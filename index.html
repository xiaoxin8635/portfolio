<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 主题色：与 main.css 的 --bg 一致，浏览器地址栏/状态栏着色 -->
    <meta name="theme-color" content="#0d0e12" />
    <!-- 预加载自托管字体，避免标题闪换字 -->
    <link rel="preload" href="/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- SEO：搜索引擎与社交媒体抓取用 -->
    <meta
      name="description"
      content="陈琦勇的个人作品集 —— 全栈开发者。项目展示、技术沉淀与联系方式。"
    />
    <meta name="keywords" content="全栈开发者,作品集,Vue,Node.js,Cloudflare" />
    <!-- Open Graph：微信 / Twitter 等社交平台分享卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="陈琦勇 · 个人作品集" />
    <meta
      property="og:description"
      content="全栈开发者的个人作品集：项目展示、技术沉淀与联系方式。"
    />
    <title>陈琦勇 · 个人作品集</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
